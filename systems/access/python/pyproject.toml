[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ntarlink-access"
version = "0.1.0"
requires-python = ">=3.11"
description = "Analytical RF link budget for compiled ntarlink contact artifacts"

[tool.setuptools.packages.find]
where = ["."]
include = ["ntarlink_access*"]
