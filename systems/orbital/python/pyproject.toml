[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ntarlink-orbital"
version = "0.1.0"
requires-python = ">=3.11"
description = "Deterministic SGP4 orbit propagation and satellite contact windows"
dependencies = [
  "skyfield==1.55",
  "sgp4==2.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ntarlink_orbital*"]

[tool.ruff]
line-length = 100
