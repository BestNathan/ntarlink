name: CI
on:
  push:
  pull_request:
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_repository_docs.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/check_pages_site.py
      - run: node scripts/test_demo_console.cjs
      - run: python -m json.tool scenarios/beam-uplink-contention.json > /dev/null && python -m json.tool scenarios/minimal.json > /dev/null && python -m json.tool scenarios/isl-failure.json > /dev/null && python -m json.tool scenarios/visibility-handover.json > /dev/null && python -m json.tool scenarios/orbital-pass.json > /dev/null && python -m json.tool scenarios/orbit-sources.sample.json > /dev/null && python -m json.tool scenarios/rf-budgets.sample.json > /dev/null && python -m json.tool platform/contracts/schemas/scenario.schema.json > /dev/null
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p ntarlink-cli -- validate scenarios/minimal.json
      - run: cargo run -p ntarlink-cli -- simulate scenarios/minimal.json
      - run: cargo run -p ntarlink-cli -- simulate scenarios/isl-failure.json --json > /tmp/ntarlink-report.json
      - name: Verify shared-beam uplink grant packet accounting
        run: |
          cargo run -p ntarlink-cli -- simulate scenarios/beam-uplink-contention.json --json > /tmp/beam-report.json
          python3 -c 'import json; x=json.load(open("/tmp/beam-report.json")); assert (x["injected"], x["delivered"], x["dropped"]) == (8,8,0), x; assert len(x["beam_grants"])==8 and all(g["wire_bytes"]==1220 for g in x["beam_grants"]); h=sorted((h for p in x["packets"] for h in p["hops"] if h["link_id"].startswith("user-")), key=lambda h:h["transmit_started_ns"]); assert [q["transmit_started_ns"] for q in h]==[i*10000000 for i in range(8)]; assert all(q["transmit_completed_ns"]-q["transmit_started_ns"]==10000000 for q in h); print("Shared uplink beam:", len(h), "grants")'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e systems/orbital/python -e systems/access/python
      - name: Generate real SGP4 visibility windows and run the Rust packet engine
        run: |
          python -m ntarlink_orbital.contacts scenarios/orbital-pass.json scenarios/orbit-sources.sample.json --out /tmp/orbital-pass-compiled.json
          python -m ntarlink_orbital.ephemeris scenarios/orbital-pass.json scenarios/orbit-sources.sample.json --step-ns 5000000000 --out /tmp/ntarlink-ephemeris.json
          python -c 'import hashlib,json,math,pathlib; p=pathlib.Path("/tmp/ntarlink-ephemeris.json"); x=json.loads(p.read_text()); m=json.loads(pathlib.Path(str(p)+".ephemeris-manifest.json").read_text()); s=x["satellites"]; assert x["frame"]=="ITRS" and x["time_scale"]=="UTC" and x["sample_count"]==240 and len(s)==1 and s[0]["id"]=="iss-demo"; v=s[0]["samples"]; assert v[0]["at_ns"]==0 and v[-1]["at_ns"]==1195000000000 and len(v)==240; assert all(6000000<math.dist(t["position_m"],[0,0,0])<8000000 for t in v); assert v[0]["position_m"]!=v[-1]["position_m"]; assert m["artifact_sha256"]==hashlib.sha256(p.read_bytes()).hexdigest(); assert m["orbit_input_sha256"]==hashlib.sha256(pathlib.Path("scenarios/orbit-sources.sample.json").read_bytes()).hexdigest(); print("Historical ITRS ephemeris:",len(v),"samples")'
          python -c 'import json; x=json.load(open("/tmp/orbital-pass-compiled.json.orbit-kinematics.json")); ids={s["link_id"] for s in x["samples"]}; assert ids=={"user-iss", "feeder-iss"}, ids; assert all(abs(s["range_rate_mps"])<8000 for s in x["samples"]); print("Doppler observations:", len(x["samples"]))'
          python -c 'import json; x=json.load(open("/tmp/orbital-pass-compiled.json")); c=x["contacts"]; assert c and all(len(w["propagation_delay_samples"])>=2 and w["propagation_delay_samples"][0]["at_ns"]==w["start_ns"] and w["propagation_delay_samples"][-1]["at_ns"]==w["end_ns"]-1 for w in c); m=json.load(open("/tmp/orbital-pass-compiled.json.orbit-manifest.json")); assert m["propagation_delay_sampling"]["sample_count"]==sum(len(w["propagation_delay_samples"]) for w in c); print("Time-varying delay samples:", m["propagation_delay_sampling"]["sample_count"])'
          python -m ntarlink_access.rf_budget /tmp/orbital-pass-compiled.json scenarios/rf-budgets.sample.json --out /tmp/orbital-rf-budget.json
          python -c 'import json, math; x=json.load(open("/tmp/orbital-rf-budget.json")); samples=x["samples"]; ids={s["link_id"] for s in samples}; assert ids=={"user-iss", "feeder-iss"}, ids; assert all(math.isfinite(s["cn_db"]) and math.isfinite(s["sinr_db"]) and s["sinr_db"]<=s["cn_db"] and s["range_m"]>0 and s["source_propagation_delay_ns"]>0 for s in samples); assert next(s for s in samples if s["link_id"]=="user-iss")["sinr_db"] < next(s for s in samples if s["link_id"]=="user-iss")["cn_db"]; print("RF budget samples:", len(samples))'
          python -m ntarlink_access.rf_time_series /tmp/orbital-pass-compiled.json scenarios/rf-budgets.sample.json --out /tmp/orbital-rf-time-series.json
          python -c 'import json, math; x=json.load(open("/tmp/orbital-rf-time-series.json")); s=x["samples"]; assert x["sample_count"]==len(s)>2; assert {p["link_id"] for p in s}=={"user-iss", "feeder-iss"}; assert all(p["contact_start_ns"]<=p["sample_ns"]<p["contact_end_ns"] and p["source_propagation_delay_ns"]>0 and math.isfinite(p["sinr_db"]) for p in s); assert len({p["range_m"] for p in s if p["link_id"]=="user-iss"})>1; print("Time-resolved RF samples:", len(s))'
          cargo run -p ntarlink-cli -- simulate /tmp/orbital-pass-compiled.json --json > /tmp/orbital-report.json
          python -c 'import json; x=json.load(open("/tmp/orbital-report.json")); assert x["delivered"] > 0 and x["dropped"] > 0, x; delays={h["propagation_ns"] for p in x["packets"] for h in p["hops"] if h["link_id"]=="user-iss"}; assert len(delays)>1, delays; print("Orbital E2E:", x["delivered"], "delivered,", x["dropped"], "dropped; dynamic user delays:", len(delays))'
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e systems/orbital/python
      - run: python -m unittest discover -s systems/orbital/python/tests
      - run: python -m pip install -e systems/access/python
      - run: python -m unittest discover -s systems/access/python/tests
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check
