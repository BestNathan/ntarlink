name: CI
on:
  push:
  pull_request:
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_repository_docs.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/check_pages_site.py
      - run: node scripts/test_demo_console.cjs
      - run: python -m json.tool scenarios/beam-uplink-contention.json > /dev/null && python -m json.tool scenarios/minimal.json > /dev/null && python -m json.tool scenarios/isl-failure.json > /dev/null && python -m json.tool scenarios/visibility-handover.json > /dev/null && python -m json.tool scenarios/orbital-pass.json > /dev/null && python -m json.tool scenarios/orbit-sources.sample.json > /dev/null && python -m json.tool scenarios/rf-budgets.sample.json > /dev/null && python -m json.tool platform/contracts/schemas/scenario.schema.json > /dev/null
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p ntarlink-cli -- validate scenarios/minimal.json
      - run: cargo run -p ntarlink-cli -- simulate scenarios/minimal.json
      - run: cargo run -p ntarlink-cli -- simulate scenarios/isl-failure.json --json > /tmp/ntarlink-report.json
      - name: Verify shared-beam uplink grant packet accounting
        run: |
          cargo run -p ntarlink-cli -- simulate scenarios/beam-uplink-contention.json --json > /tmp/beam-report.json
          python3 -c 'import json; x=json.load(open("/tmp/beam-report.json")); assert (x["injected"], x["delivered"], x["dropped"]) == (8,8,0), x; assert len(x["beam_grants"])==8 and all(g["wire_bytes"]==1220 for g in x["beam_grants"]); h=sorted((h for p in x["packets"] for h in p["hops"] if h["link_id"].startswith("user-")), key=lambda h:h["transmit_started_ns"]); assert [q["transmit_started_ns"] for q in h]==[i*10000000 for i in range(8)]; assert all(q["transmit_completed_ns"]-q["transmit_started_ns"]==10000000 for q in h); print("Shared uplink beam:", len(h), "grants")'
      - name: Verify PAT tracking gates optical packet forwarding
        run: |
          python3 -m json.tool scenarios/optical-pat-acquisition.json > /dev/null
          cargo run -p ntarlink-cli -- simulate scenarios/optical-pat-acquisition.json --json > /tmp/ntarlink-pat-report.json
          python3 -c 'import json; r=json.load(open("/tmp/ntarlink-pat-report.json")); t=[e["at_ns"] for e in r["pat_events"] if e["state"]=="tracking"]; assert t==[20000000,140000000], t; assert r["delivered"]>0 and r["dropped"]>0 and r["injected"]==r["delivered"]+r["dropped"], r; h=[h for p in r["packets"] for h in p["hops"] if h["link_id"]=="isl-a-b"]; assert h and all(20000000<=v["transmit_started_ns"]<120000000 or 140000000<=v["transmit_started_ns"]<200000000 for v in h), h; print("PAT packet gate:",r["delivered"],"delivered,",r["dropped"],"dropped")'
      - name: Verify optical PAT fault releases and reacquires tracking
        run: |
          python3 -m json.tool scenarios/optical-pat-link-fault.json > /dev/null
          cargo run -p ntarlink-cli -- simulate scenarios/optical-pat-link-fault.json --json > /tmp/ntarlink-pat-fault-report.json
          python3 - <<'PY'
          import json
          r = json.load(open("/tmp/ntarlink-pat-fault-report.json"))
          tracking = [e["at_ns"] for e in r["pat_events"] if e["state"] == "tracking"]
          assert tracking == [20000000, 90000000, 140000000], tracking
          assert any(e["at_ns"] == 50000000 and e["state"] == "lost" and e["reason"] == "administrative_link_down" for e in r["pat_events"])
          assert any(e["kind"] == "contact_open" and e["link_id"] == "isl-a-b" and e["at_ns"] == 90000000 for e in r["control_events"])
          windows = [(20000000, 50000000), (90000000, 120000000), (140000000, 200000000)]
          hops = [h for p in r["packets"] for h in p["hops"] if h["link_id"] == "isl-a-b"]
          assert hops and all(any(start <= h["transmit_started_ns"] < end for start, end in windows) for h in hops), hops
          assert any(90000000 <= h["transmit_started_ns"] < 120000000 for h in hops), hops
          assert r["injected"] == r["delivered"] + r["dropped"], r
          print("PAT fault recovery:", r["delivered"], "delivered,", r["dropped"], "dropped")
          PY
      - name: Verify SYS-02 pointing envelope rejects geometrically visible ISL
        run: |
          python3 -m json.tool scenarios/optical-pointing-envelope.json > /dev/null
          cargo run -p ntarlink-cli -- simulate scenarios/optical-pointing-envelope.json --json > /tmp/ntarlink-pointing.json
          python3 - <<'PY'
          import json
          r = json.load(open("/tmp/ntarlink-pointing.json"))
          rejected = [e for e in r["pat_events"] if e["state"] == "rejected" and e["reason"] == "pointing_outside_envelope"]
          assert len(rejected) == 2, rejected
          assert not any(e["state"] == "tracking" for e in r["pat_events"])
          assert r["delivered"] == 0 and r["dropped"] == r["injected"] == 7, r
          assert not any(h["link_id"] == "isl-a-b" for p in r["packets"] for h in p["hops"])
          print("SYS-02 static pointing:", len(rejected), "rejected contacts")
          PY
      - name: Verify SYS-02 ITRS geometry gates individual optical contacts
        run: |
          python3 -m json.tool scenarios/optical-itrs-pointing.json > /dev/null
          cargo run -p ntarlink-cli -- simulate scenarios/optical-itrs-pointing.json --json > /tmp/ntarlink-itrs-pointing.json
          python3 - <<'PY'
          import json
          r = json.load(open("/tmp/ntarlink-itrs-pointing.json"))
          tracking = [e["at_ns"] for e in r["pat_events"] if e["state"] == "tracking"]
          rejected = [e for e in r["pat_events"] if e["reason"] == "geometry_outside_envelope"]
          assert tracking == [20000000], tracking
          assert len(rejected) == 1 and rejected[0]["at_ns"] == 120000000, rejected
          assert r["delivered"] > 0 and r["dropped"] > 0, r
          assert r["injected"] == r["delivered"] + r["dropped"], r
          hops = [h for p in r["packets"] for h in p["hops"] if h["link_id"] == "isl-a-b"]
          assert hops and all(20000000 <= h["transmit_started_ns"] < 120000000 for h in hops), hops
          print("SYS-02 ITRS pointing:", len(tracking), "acquired,", len(rejected), "rejected")
          PY
      - name: Verify SYS-02 optical head outage gates PAT and packet forwarding
        run: |
          python3 -m json.tool scenarios/optical-head-outage.json > /dev/null
          cargo run -p ntarlink-cli -- simulate scenarios/optical-head-outage.json --json > /tmp/ntarlink-head-outage.json
          python3 - <<'PY'
          import json
          r = json.load(open("/tmp/ntarlink-head-outage.json"))
          tracking = [e["at_ns"] for e in r["pat_events"] if e["state"] == "tracking"]
          assert tracking == [20000000, 90000000, 140000000], tracking
          assert any(e["at_ns"] == 50000000 and e["state"] == "lost" and e["reason"] == "optical_head_unavailable" for e in r["pat_events"])
          assert any(e["at_ns"] == 90000000 and e["kind"] == "contact_open" for e in r["control_events"])
          windows = [(20000000, 50000000), (90000000, 120000000), (140000000, 200000000)]
          hops = [h for p in r["packets"] for h in p["hops"] if h["link_id"] == "isl-a-b"]
          assert hops and all(any(a <= h["transmit_started_ns"] < b for a, b in windows) for h in hops)
          assert r["injected"] == r["delivered"] + r["dropped"]
          print("SYS-02 head outage:", r["delivered"], "delivered,", r["dropped"], "dropped")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e systems/orbital/python -e systems/access/python
      - name: Verify SGP4-derived SYS-02 optical pointing through PAT packet forwarding
        run: |
          python -m ntarlink_orbital.optical_geometry scenarios/optical-sgp4-attitude.json scenarios/optical-sgp4-orbits.synthetic.json scenarios/optical-sgp4-attitude.synthetic.json --pointing-probes-per-contact 3 --out /tmp/optical-sgp4-compiled.json
          cargo run -p ntarlink-cli -- validate /tmp/optical-sgp4-compiled.json
          cargo run -p ntarlink-cli -- simulate /tmp/optical-sgp4-compiled.json --json > /tmp/optical-sgp4-report.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          compiled = Path("/tmp/optical-sgp4-compiled.json")
          scenario = json.loads(compiled.read_text())
          manifest = json.loads(Path(str(compiled) + ".optical-manifest.json").read_text())
          geometry = scenario["optical_geometry"]
          assert len(geometry) == manifest["snapshot_count"] == 2
          audit = manifest["pointing_probe_audit"]
          assert audit["contact_count"] == 2 and audit["sample_count"] == 10, audit
          assert len(audit["contacts"]) == 2 and all(c["sample_count"] == 5 for c in audit["contacts"]), audit
          assert manifest["artifact_sha256"] == hashlib.sha256(compiled.read_bytes()).hexdigest()
          assert [g["at_ns"] for g in geometry] == [0, 120000000]
          assert all(g["frame"] == "ITRS" and g["from_position_m"] != g["to_position_m"] for g in geometry)
          report = json.loads(Path("/tmp/optical-sgp4-report.json").read_text())
          tracking = [e["at_ns"] for e in report["pat_events"] if e["state"] == "tracking"]
          assert tracking == [20000000, 140000000], tracking
          assert report["delivered"] > 0 and report["injected"] == report["delivered"] + report["dropped"]
          print("Synthetic two-orbit SGP4 optical PAT:", len(geometry), "snapshots,", report["delivered"], "delivered")
          PY
      - name: Verify sampled optical attitude SGP4 to PAT packet forwarding
        run: |
          python -m ntarlink_orbital.optical_geometry scenarios/optical-sgp4-attitude.json scenarios/optical-sgp4-orbits.synthetic.json scenarios/optical-sgp4-attitude-sampled.synthetic.json --pointing-probes-per-contact 3 --out /tmp/optical-sampled-compiled.json
          cargo run -p ntarlink-cli -- validate /tmp/optical-sampled-compiled.json
          cargo run -p ntarlink-cli -- simulate /tmp/optical-sampled-compiled.json --json > /tmp/optical-sampled-report.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          artifact = Path("/tmp/optical-sampled-compiled.json")
          scenario = json.loads(artifact.read_text())
          manifest = json.loads(Path(str(artifact) + ".optical-manifest.json").read_text())
          report = json.loads(Path("/tmp/optical-sampled-report.json").read_text())
          assert manifest["attitude_model"] == "sampled_body_to_itrs_quaternion"
          assert manifest["artifact_sha256"] == hashlib.sha256(artifact.read_bytes()).hexdigest()
          assert manifest["pointing_probe_audit"]["sample_count"] == 10
          assert len(scenario["optical_geometry"]) == 2
          assert [e["at_ns"] for e in report["pat_events"] if e["state"] == "tracking"] == [20000000, 140000000]
          assert report["delivered"] > 0 and report["injected"] == report["delivered"] + report["dropped"]
          print("Sampled attitude SGP4 PAT:", report["delivered"], "delivered")
          PY
      - name: Verify sampled pointing loss through PAT and packet forwarding
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          from unittest.mock import patch
          from ntarlink_orbital.optical_geometry import main

          def synthetic_itrs(satellite, at_ns):
              return (7_000_000.0 + (1_000.0 if satellite == "sat-b" else 0.0), 0.0, 0.0)

          artifact = Path("/tmp/optical-tracking-compiled.json")
          with patch("ntarlink_orbital.optical_geometry.build_sgp4_provider",
                     return_value=synthetic_itrs):
              main([
                  "scenarios/optical-sgp4-attitude.json",
                  "scenarios/optical-sgp4-orbits.synthetic.json",
                  "scenarios/optical-sgp4-attitude-tracking.synthetic.json",
                  "--runtime-pointing-probes-per-contact", "3",
                  "--out", str(artifact),
              ])
          compiled = json.loads(artifact.read_text())
          manifest = json.loads(Path(str(artifact) + ".optical-manifest.json").read_text())
          assert manifest["artifact_sha256"] == hashlib.sha256(artifact.read_bytes()).hexdigest()
          assert manifest["pointing_tracking_plan"]["sample_count"] == 10
          assert [(f["at_ns"], f["action"], f["cause"]) for f in compiled["faults"]] == [
              (30000000, "down", "sampled_pointing"),
              (90000000, "up", "sampled_pointing")
          ], compiled["faults"]
          PY
          cargo run -p ntarlink-cli -- validate /tmp/optical-tracking-compiled.json
          cargo run -p ntarlink-cli -- simulate /tmp/optical-tracking-compiled.json --json > /tmp/optical-tracking-report.json
          python3 - <<'PY'
          import json
          r = json.load(open("/tmp/optical-tracking-report.json"))
          tracking = [e["at_ns"] for e in r["pat_events"] if e["state"] == "tracking"]
          assert tracking == [20000000, 110000000, 140000000], tracking
          assert any(e["state"] == "lost" and e["at_ns"] == 30000000
                     and e["reason"] == "sampled_pointing_loss"
                     for e in r["pat_events"]), r["pat_events"]
          assert any(e["kind"] == "link_down" and e["at_ns"] == 30000000
                     for e in r["control_events"]), r["control_events"]
          hops = [h for p in r["packets"] for h in p["hops"]
                  if h["link_id"] == "isl-a-b"]
          assert all(not 30000000 <= h["transmit_started_ns"] < 110000000
                     for h in hops), hops
          assert r["delivered"] > 0 and r["dropped"] > 0
          assert r["injected"] == r["delivered"] + r["dropped"], r
          print("Sampled pointing tracking:", tracking, "delivered", r["delivered"])
          PY
      - name: Verify SGP4/ITRS sampled attitude feeds Rust-native PAT steering
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          from unittest.mock import patch
          from ntarlink_orbital.optical_geometry import main

          def synthetic_itrs(satellite, at_ns):
              return (7_000_000.0 + (1_000.0 if satellite == "sat-b" else 0.0), 0.0, 0.0)

          source = json.loads(Path("scenarios/optical-sgp4-attitude.json").read_text())
          source["faults"] = [
              {"link_id": "isl-a-b", "at_ns": 40000000, "action": "down"},
              {"link_id": "isl-a-b", "at_ns": 70000000, "action": "up"},
          ]
          input_path = Path("/tmp/optical-native-scenario.json")
          input_path.write_text(json.dumps(source))
          artifact = Path("/tmp/optical-native-sgp4-compiled.json")
          with patch("ntarlink_orbital.optical_geometry.build_sgp4_provider",
                     return_value=synthetic_itrs):
              main([
                  str(input_path),
                  "scenarios/optical-sgp4-orbits.synthetic.json",
                  "scenarios/optical-sgp4-attitude-tracking.synthetic.json",
                  "--native-steering-probes-per-contact", "3",
                  "--out", str(artifact),
              ])
          compiled = json.loads(artifact.read_text())
          manifest = json.loads(Path(str(artifact) + ".optical-manifest.json").read_text())
          assert "optical_geometry" not in compiled
          assert len(compiled["optical_steering_samples"]) == 10
          assert compiled["faults"] == source["faults"]
          assert manifest["native_steering_plan"]["sample_count"] == 10
          assert manifest["artifact_sha256"] == hashlib.sha256(artifact.read_bytes()).hexdigest()
          PY
          cargo run -p ntarlink-cli -- validate /tmp/optical-native-sgp4-compiled.json
          cargo run -p ntarlink-cli -- simulate /tmp/optical-native-sgp4-compiled.json --json > /tmp/optical-native-sgp4-report.json
          python3 - <<'PY'
          import json
          r = json.load(open("/tmp/optical-native-sgp4-report.json"))
          tracking = [e["at_ns"] for e in r["pat_events"] if e["state"] == "tracking"]
          assert tracking == [20000000, 110000000, 140000000], tracking
          assert any(e["at_ns"] == 30000000 and e["state"] == "lost"
                     and e["reason"] == "sampled_pointing_loss" for e in r["pat_events"])
          edges = [(e["at_ns"], e["kind"]) for e in r["control_events"]
                   if e["link_id"] == "isl-a-b" and e["kind"] in ("link_down", "link_up")]
          assert edges == [(30000000, "link_down"), (90000000, "link_up")], edges
          hops = [h for p in r["packets"] for h in p["hops"] if h["link_id"] == "isl-a-b"]
          assert all(not 30000000 <= h["transmit_started_ns"] < 110000000 for h in hops)
          assert r["injected"] == r["delivered"] + r["dropped"]
          print("SGP4/attitude to native PAT:", tracking, r["delivered"], "delivered")
          PY
      - name: Verify real SGP4 ITRS samples drive Rust-native PAT tracking
        run: |
          python -m ntarlink_orbital.optical_geometry scenarios/optical-sgp4-attitude.json scenarios/optical-sgp4-orbits.synthetic.json scenarios/optical-sgp4-attitude-sampled.synthetic.json --native-steering-probes-per-contact 3 --out /tmp/optical-native-real-sgp4.json
          cargo run -p ntarlink-cli -- validate /tmp/optical-native-real-sgp4.json
          cargo run -p ntarlink-cli -- simulate /tmp/optical-native-real-sgp4.json --json > /tmp/optical-native-real-sgp4-report.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          artifact = Path("/tmp/optical-native-real-sgp4.json")
          scenario = json.loads(artifact.read_text())
          manifest = json.loads(Path(str(artifact) + ".optical-manifest.json").read_text())
          report = json.loads(Path("/tmp/optical-native-real-sgp4-report.json").read_text())
          assert "optical_geometry" not in scenario
          assert len(scenario["optical_steering_samples"]) == 10
          assert manifest["steering_sample_count"] == 10
          assert manifest["artifact_sha256"] == hashlib.sha256(artifact.read_bytes()).hexdigest()
          assert [e["at_ns"] for e in report["pat_events"] if e["state"] == "tracking"] == [20000000, 140000000]
          assert report["delivered"] > 0
          assert report["injected"] == report["delivered"] + report["dropped"]
          print("Real SGP4 to native PAT:", report["delivered"], "delivered")
          PY
      - name: Verify sampled body attitude rate guard with SGP4 and native PAT
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path("scenarios/optical-sgp4-attitude-sampled.synthetic.json").read_text())
          source["heads"][0]["max_body_attitude_rate_deg_per_s"] = 120.0
          Path("/tmp/optical-rate-valid.json").write_text(json.dumps(source))
          source["heads"][0]["max_body_attitude_rate_deg_per_s"] = 90.0
          Path("/tmp/optical-rate-invalid.json").write_text(json.dumps(source))
          PY
          python -m ntarlink_orbital.optical_geometry scenarios/optical-sgp4-attitude.json scenarios/optical-sgp4-orbits.synthetic.json /tmp/optical-rate-valid.json --native-steering-probes-per-contact 3 --out /tmp/optical-rate-compiled.json
          cargo run -p ntarlink-cli -- validate /tmp/optical-rate-compiled.json
          cargo run -p ntarlink-cli -- simulate /tmp/optical-rate-compiled.json --json > /tmp/optical-rate-report.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          artifact = Path("/tmp/optical-rate-compiled.json")
          manifest = json.loads(Path(str(artifact) + ".optical-manifest.json").read_text())
          rates = {entry["head_id"]: entry for entry in manifest["attitude_rate_audit"]}
          assert rates["sat-a/head-1"]["max_body_attitude_rate_deg_per_s"] == 120.0
          assert abs(rates["sat-a/head-1"]["peak_interpolated_rate_deg_per_s"] - 100.0) < 1e-6
          assert manifest["artifact_sha256"] == hashlib.sha256(artifact.read_bytes()).hexdigest()
          report = json.loads(Path("/tmp/optical-rate-report.json").read_text())
          assert report["delivered"] > 0
          assert report["injected"] == report["delivered"] + report["dropped"]
          PY
          sha256sum /tmp/optical-rate-compiled.json /tmp/optical-rate-compiled.json.optical-manifest.json > /tmp/optical-rate-checksums
          if python -m ntarlink_orbital.optical_geometry scenarios/optical-sgp4-attitude.json scenarios/optical-sgp4-orbits.synthetic.json /tmp/optical-rate-invalid.json --native-steering-probes-per-contact 3 --out /tmp/optical-rate-compiled.json; then
            echo "Expected excessive sampled attitude rate to fail" >&2
            exit 1
          fi
          sha256sum -c /tmp/optical-rate-checksums
      - name: Verify overlapping administrative and pointing faults cannot reopen PAT early
        run: |
          python3 -m json.tool scenarios/optical-pat-overlapping-faults.json > /dev/null
          cargo run -p ntarlink-cli -- simulate scenarios/optical-pat-overlapping-faults.json --json > /tmp/optical-overlap-report.json
          python3 - <<'PY'
          import json
          r = json.load(open("/tmp/optical-overlap-report.json"))
          tracking = [e["at_ns"] for e in r["pat_events"] if e["state"] == "tracking"]
          assert tracking == [20000000, 90000000, 140000000], tracking
          assert any(e["at_ns"] == 30000000 and e["state"] == "lost"
                     and e["reason"] == "sampled_pointing_loss" for e in r["pat_events"])
          fault_edges = [(e["at_ns"], e["kind"]) for e in r["control_events"]
                         if e["link_id"] == "isl-a-b" and e["kind"] in ("link_up", "link_down")]
          assert fault_edges == [(30000000, "link_down"), (70000000, "link_up")], fault_edges
          hops = [h for p in r["packets"] for h in p["hops"] if h["link_id"] == "isl-a-b"]
          assert hops and all(not 30000000 <= h["transmit_started_ns"] < 90000000 for h in hops), hops
          assert r["injected"] == r["delivered"] + r["dropped"], r
          print("Independent PAT fault domains:", r["delivered"], "delivered,", r["dropped"], "dropped")
          PY
      - name: Verify Rust-native sampled steering preserves independent administrative faults
        run: |
          python3 -m json.tool scenarios/optical-native-steering-samples.json > /dev/null
          cargo run -p ntarlink-cli -- validate scenarios/optical-native-steering-samples.json
          cargo run -p ntarlink-cli -- simulate scenarios/optical-native-steering-samples.json --json > /tmp/optical-native-steering.json
          python3 - <<'PY'
          import json
          r = json.load(open("/tmp/optical-native-steering.json"))
          tracking = [e["at_ns"] for e in r["pat_events"] if e["state"] == "tracking"]
          assert tracking == [20000000, 90000000, 140000000], tracking
          assert any(e["at_ns"] == 30000000 and e["state"] == "lost"
                     and e["reason"] == "sampled_pointing_loss" for e in r["pat_events"])
          edges = [(e["at_ns"], e["kind"]) for e in r["control_events"]
                   if e["link_id"] == "isl-a-b" and e["kind"] in ("link_down", "link_up")]
          assert edges == [(30000000, "link_down"), (70000000, "link_up")], edges
          hops = [h for p in r["packets"] for h in p["hops"] if h["link_id"] == "isl-a-b"]
          assert hops and all(not 30000000 <= h["transmit_started_ns"] < 90000000 for h in hops)
          assert r["injected"] == r["delivered"] + r["dropped"]
          print("Rust-native sampled steering:", r["delivered"], "delivered,", r["dropped"], "dropped")
          PY
      - name: Generate real SGP4 visibility windows and run the Rust packet engine
        run: |
          python -m ntarlink_orbital.contacts scenarios/orbital-pass.json scenarios/orbit-sources.sample.json --out /tmp/orbital-pass-compiled.json
          python -m ntarlink_orbital.ephemeris scenarios/orbital-pass.json scenarios/orbit-sources.sample.json --step-ns 5000000000 --out /tmp/ntarlink-ephemeris.json
          python -m ntarlink_orbital.ephemeris_audit scenarios/orbital-pass.json scenarios/orbit-sources.sample.json /tmp/ntarlink-ephemeris.json --source-manifest /tmp/ntarlink-ephemeris.json.ephemeris-manifest.json --probes-per-interval 3 --max-probe-error-m 250 --out /tmp/ntarlink-ephemeris-audit.json
          python -c 'import json; x=json.load(open("/tmp/ntarlink-ephemeris-audit.json")); assert x["passed"] and x["midpoint_count"]==239 and x["probes_per_interval"]==3 and x["probe_count"]==717 and x["max_probe_error_m"]<250 and x["max_probe_error_m"]>=x["max_midpoint_error_m"], x; print("ITRS interior audit:",x["probe_count"],"probes, max error",x["max_probe_error_m"],"m")'
          python -c 'import hashlib,json,math,pathlib; p=pathlib.Path("/tmp/ntarlink-ephemeris.json"); x=json.loads(p.read_text()); m=json.loads(pathlib.Path(str(p)+".ephemeris-manifest.json").read_text()); s=x["satellites"]; assert x["frame"]=="ITRS" and x["time_scale"]=="UTC" and x["sample_count"]==240 and len(s)==1 and s[0]["id"]=="iss-demo"; v=s[0]["samples"]; assert v[0]["at_ns"]==0 and v[-1]["at_ns"]==1195000000000 and len(v)==240; assert all(6000000<math.dist(t["position_m"],[0,0,0])<8000000 for t in v); assert v[0]["position_m"]!=v[-1]["position_m"]; assert m["artifact_sha256"]==hashlib.sha256(p.read_bytes()).hexdigest(); assert m["orbit_input_sha256"]==hashlib.sha256(pathlib.Path("scenarios/orbit-sources.sample.json").read_bytes()).hexdigest(); print("Historical ITRS ephemeris:",len(v),"samples")'
          python -c 'import json; x=json.load(open("/tmp/orbital-pass-compiled.json.orbit-kinematics.json")); ids={s["link_id"] for s in x["samples"]}; assert ids=={"user-iss", "feeder-iss"}, ids; assert all(abs(s["range_rate_mps"])<8000 for s in x["samples"]); print("Doppler observations:", len(x["samples"]))'
          python -c 'import json; x=json.load(open("/tmp/orbital-pass-compiled.json")); c=x["contacts"]; assert c and all(len(w["propagation_delay_samples"])>=2 and w["propagation_delay_samples"][0]["at_ns"]==w["start_ns"] and w["propagation_delay_samples"][-1]["at_ns"]==w["end_ns"]-1 for w in c); m=json.load(open("/tmp/orbital-pass-compiled.json.orbit-manifest.json")); assert m["propagation_delay_sampling"]["sample_count"]==sum(len(w["propagation_delay_samples"]) for w in c); print("Time-varying delay samples:", m["propagation_delay_sampling"]["sample_count"])'
          python -m ntarlink_access.rf_budget /tmp/orbital-pass-compiled.json scenarios/rf-budgets.sample.json --out /tmp/orbital-rf-budget.json
          python -c 'import json, math; x=json.load(open("/tmp/orbital-rf-budget.json")); samples=x["samples"]; ids={s["link_id"] for s in samples}; assert ids=={"user-iss", "feeder-iss"}, ids; assert all(math.isfinite(s["cn_db"]) and math.isfinite(s["sinr_db"]) and s["sinr_db"]<=s["cn_db"] and s["range_m"]>0 and s["source_propagation_delay_ns"]>0 for s in samples); assert next(s for s in samples if s["link_id"]=="user-iss")["sinr_db"] < next(s for s in samples if s["link_id"]=="user-iss")["cn_db"]; print("RF budget samples:", len(samples))'
          python -m ntarlink_access.rf_time_series /tmp/orbital-pass-compiled.json scenarios/rf-budgets.sample.json --out /tmp/orbital-rf-time-series.json
          python -c 'import json, math; x=json.load(open("/tmp/orbital-rf-time-series.json")); s=x["samples"]; assert x["sample_count"]==len(s)>2; assert {p["link_id"] for p in s}=={"user-iss", "feeder-iss"}; assert all(p["contact_start_ns"]<=p["sample_ns"]<p["contact_end_ns"] and p["source_propagation_delay_ns"]>0 and math.isfinite(p["sinr_db"]) for p in s); assert len({p["range_m"] for p in s if p["link_id"]=="user-iss"})>1; print("Time-resolved RF samples:", len(s))'
          cargo run -p ntarlink-cli -- simulate /tmp/orbital-pass-compiled.json --json > /tmp/orbital-report.json
          python -c 'import json; x=json.load(open("/tmp/orbital-report.json")); assert x["delivered"] > 0 and x["dropped"] > 0, x; delays={h["propagation_ns"] for p in x["packets"] for h in p["hops"] if h["link_id"]=="user-iss"}; assert len(delays)>1, delays; print("Orbital E2E:", x["delivered"], "delivered,", x["dropped"], "dropped; dynamic user delays:", len(delays))'
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e systems/orbital/python
      - run: python -m unittest discover -s systems/orbital/python/tests
      - name: Verify historical ISS JSONL producer-consumer contract
        run: |
          python -m ntarlink_orbital.ephemeris_stream scenarios/orbital-pass.json scenarios/orbit-sources.sample.json --step-ns 5000000000 --out /tmp/ntarlink-iss-reader.jsonl
          python -m ntarlink_orbital.ephemeris_reader /tmp/ntarlink-iss-reader.jsonl
      - name: Measure bounded synthetic JSONL producer and verified reader
        run: |
          python -m ntarlink_orbital.ephemeris_benchmark --satellites 10 --samples-per-satellite 100 --report /tmp/ntarlink-bench-1k.json
          python -m ntarlink_orbital.ephemeris_benchmark --satellites 100 --samples-per-satellite 100 --report /tmp/ntarlink-bench-10k.json
          python -c 'import json; a=json.load(open("/tmp/ntarlink-bench-1k.json")); b=json.load(open("/tmp/ntarlink-bench-10k.json")); assert (a["sample_count"],a["verified_sample_count"],b["sample_count"],b["verified_sample_count"]) == (1000,1000,10000,10000); assert b["artifact_bytes"]>a["artifact_bytes"]; assert all(x[k]>0 for x in (a,b) for k in ("export_samples_per_second","verified_read_samples_per_second","export_python_heap_peak_bytes","verified_read_python_heap_peak_bytes")); print("Synthetic JSONL benchmark:",a["artifact_bytes"],b["artifact_bytes"],"bytes")'
      - name: Smoke-test production SGP4/ITRS scale benchmark
        run: |
          python -m ntarlink_orbital.sgp4_scale_benchmark scenarios/orbit-sources.sample.json --satellites 10 --samples-per-satellite 10 --report /tmp/ntarlink-sgp4-scale.json
          python -c 'import json; r=json.load(open("/tmp/ntarlink-sgp4-scale.json")); assert r["sample_count"]==100 and r["frame"]=="ITRS" and r["source_tle_count"]==1 and r["propagation_samples_per_second"]>0 and len(r["position_digest_sha256"])==64, r; print("Historical repeated-TLE ITRS samples:", r["sample_count"])'
      - name: Verify isolated production SGP4/ITRS benchmark report
        run: |
          python -m ntarlink_orbital.sgp4_scale_benchmark_suite scenarios/orbit-sources.sample.json --satellites 2 --samples-per-satellite 2 --repetitions 2 --report /tmp/ntarlink-sgp4-suite.json
          python -c 'import json; r=json.load(open("/tmp/ntarlink-sgp4-suite.json")); assert r["sample_count"]==4 and r["repetitions"]==2 and len(r["position_digest_sha256"])==64 and r["max_process_peak_rss_bytes"]>0 and r["median_propagation_samples_per_second"]>0 and all(r[k]>0 for k in ("max_rss_before_provider_bytes","max_rss_after_provider_bytes","max_rss_after_propagation_bytes")), r; print("Isolated SGP4/ITRS:", r["sample_count"], "samples in", r["repetitions"], "runs")'
      - run: python -m pip install -e systems/access/python
      - run: python -m unittest discover -s systems/access/python/tests
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check
