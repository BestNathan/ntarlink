name: CI
on:
  push:
  pull_request:
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_repository_docs.py
      - run: python -m json.tool scenarios/minimal.json > /dev/null && python -m json.tool scenarios/isl-failure.json > /dev/null && python -m json.tool platform/contracts/schemas/scenario.schema.json > /dev/null
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p ntarlink-cli -- validate scenarios/minimal.json
      - run: cargo run -p ntarlink-cli -- simulate scenarios/minimal.json
      - run: cargo run -p ntarlink-cli -- simulate scenarios/isl-failure.json --json > /tmp/ntarlink-report.json
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s systems/orbital/python/tests
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check
