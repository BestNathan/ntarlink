name: Stage Pages source files
on:
  push:
    branches: [feat/pages-system-showcase]
    paths: [.pages-source.xz.b64]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract verified Pages source files into this branch
        run: |
          python3 - <<'PY'
          import base64, json, lzma
          from pathlib import Path
          archive = Path(".pages-source.xz.b64")
          files = json.loads(lzma.decompress(base64.b64decode(archive.read_text().strip())))
          expected = {
            "applications/console/package.json",
            "applications/console/tsconfig.json",
            "applications/console/tsconfig.build.json",
            "applications/console/index.html",
            "applications/console/styles.css",
            "applications/console/src/catalog.ts",
            "applications/console/src/mock.ts",
            "applications/console/src/main.ts",
            ".github/workflows/pages.yml",
            "scripts/check_pages_build.py",
            "docs/pages.md",
          }
          if set(files) != expected:
              raise SystemExit("Unexpected source file inventory")
          for name, content in files.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding="utf-8")
          archive.unlink()
          Path(".github/workflows/source-unpack.yml").unlink()
          print("Extracted", len(files), "verified source files")
          PY
      - name: Commit readable source and remove staging workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add interactive Pages showcase for 16 satellite subsystems"
          git push origin HEAD:feat/pages-system-showcase
