name: S2 Linux IP Emulation

on:
  pull_request:
    paths:
      - '.github/workflows/s2-linux-ip.yml'
      - 'systems/network-emulation/**'
      - 'scripts/tests/test_s2_worker.py'
      - 'scenarios/s2-linux-ip-path.json'
      - 'docs/design/s2-linux-ip-emulation.md'
      - 'scripts/record_s2_host_deps.py'
      - 'docs/dependencies.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/s2-linux-ip.yml'
      - 'systems/network-emulation/**'
      - 'scripts/tests/test_s2_worker.py'
      - 'scenarios/s2-linux-ip-path.json'
      - 'docs/design/s2-linux-ip-emulation.md'
      - 'scripts/record_s2_host_deps.py'
      - 'docs/dependencies.md'

jobs:
  linux-ip:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate S1-to-S2 export and dry-run without privileges
        run: |
          python -m unittest discover -s scripts/tests -p test_s2_worker.py -v
          python systems/network-emulation/s2_worker.py scenarios/s2-linux-ip-path.json --source ue-a --target gw-a --output /tmp/s2-plan.json
          python - <<'PY'
          import json
          p = json.load(open('/tmp/s2-plan.json'))
          assert p['mode'] == 'dry-run' and not p['changes_applied']
          assert len(p['plan']['links']) == 3
          print('S2 dry-run path:', [x['id'] for x in p['plan']['links']])
          PY
      - name: Install controlled Linux test-host tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update -qq
          sudo -E apt-get install -y -qq iproute2 iputils-ping iperf3 tcpdump
          uname -a
          ip -Version
          tc -Version
          iperf3 --version
      - name: Pin reviewed S2 binary compatibility and record package license provenance
        run: python scripts/record_s2_host_deps.py --check --output /tmp/s2-host-deps.json
      - name: Validate live multihop path, outage and recovery
        run: |
          sudo python systems/network-emulation/s2_worker.py scenarios/s2-linux-ip-path.json --source ue-a --target gw-a --tag s2 --apply --time-scale 20 --iperf --pcap /tmp/ntarlink-s2.pcap --output /tmp/s2-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.load(open('/tmp/s2-report.json'))
          report = r['report']
          observations = report['probes']
          assert [p['success'] for p in observations] == [True, False, True], observations
          assert report['iperf']['received_bytes'] > 0, report['iperf']
          assert len(report['events']) == 2, report['events']
          assert report['initial_kernel_state']['routes'], report
          assert all('netem' in q for q in report['initial_kernel_state']['qdisc'].values())
          assert report['cleanup_errors'] == [], report['cleanup_errors']
          assert Path('/tmp/ntarlink-s2.pcap').stat().st_size > 24
          print('S2 real Linux acceptance:', [p['success'] for p in observations])
          print('S2 measured received bytes:', report['iperf']['received_bytes'])
          print('S2 scheduler lateness (ns):', [e['scheduler_lateness_ns'] for e in report['events']])
          PY
          ! sudo ip netns list | grep -E '^nts2n[0-9]+($| )'
      - name: Save measured S2 evidence (no synthetic labels)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-linux-ip-evidence
          path: |
            /tmp/s2-plan.json
            /tmp/s2-host-deps.json
            /tmp/s2-report.json
            /tmp/ntarlink-s2.pcap
          if-no-files-found: ignore
          retention-days: 7
