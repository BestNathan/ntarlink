name: S2 Linux IP Emulation

on:
  pull_request:
    paths:
      - '.github/workflows/s2-linux-ip.yml'
      - 'systems/network-emulation/**'
      - 'scripts/tests/test_s2_worker.py'
      - 'scripts/tests/test_s2_route_failover.py'
      - 'scenarios/s2-route-failover.json'
      - 'scenarios/s2-linux-ip-path.json'
      - 'docs/design/s2-linux-ip-emulation.md'
      - 'scripts/record_s2_host_deps.py'
      - 'docs/dependencies.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/s2-linux-ip.yml'
      - 'systems/network-emulation/**'
      - 'scripts/tests/test_s2_worker.py'
      - 'scripts/tests/test_s2_route_failover.py'
      - 'scenarios/s2-route-failover.json'
      - 'scenarios/s2-linux-ip-path.json'
      - 'docs/design/s2-linux-ip-emulation.md'
      - 'scripts/record_s2_host_deps.py'
      - 'docs/dependencies.md'

jobs:
  linux-ip:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate S1-to-S2 export and dry-run without privileges
        run: |
          python -m unittest discover -s scripts/tests -p test_s2_worker.py -v
          python -m unittest discover -s scripts/tests -p test_s2_route_failover.py -v
          python systems/network-emulation/s2_routing.py scenarios/s2-route-failover.json --source ue-a --target internet --output /tmp/s2-routing-plan.json
          python systems/network-emulation/s2_worker.py scenarios/s2-linux-ip-path.json --source ue-a --target gw-a --output /tmp/s2-plan.json
          python - <<'PY'
          import json
          p = json.load(open('/tmp/s2-plan.json'))
          assert p['mode'] == 'dry-run' and not p['changes_applied']
          assert len(p['plan']['links']) == 3
          print('S2 dry-run path:', [x['id'] for x in p['plan']['links']])
          PY
      - name: Install controlled Linux test-host tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update -qq
          sudo -E apt-get install -y -qq iproute2 iputils-ping iperf3 tcpdump
          uname -a
          ip -Version
          tc -Version
          iperf3 --version
      - name: Pin reviewed S2 binary compatibility and record package license provenance
        run: python scripts/record_s2_host_deps.py --check --output /tmp/s2-host-deps.json
      - name: Validate live multihop path, outage and recovery
        run: |
          sudo python systems/network-emulation/s2_worker.py scenarios/s2-linux-ip-path.json --source ue-a --target gw-a --tag s2 --apply --time-scale 20 --iperf --pcap /tmp/ntarlink-s2.pcap --output /tmp/s2-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.load(open('/tmp/s2-report.json'))
          report = r['report']
          observations = report['probes']
          assert [p['success'] for p in observations] == [True, False, True], observations
          assert report['iperf']['received_bytes'] > 0, report['iperf']
          assert len(report['events']) == 2, report['events']
          assert report['initial_kernel_state']['routes'], report
          assert all('netem' in q for q in report['initial_kernel_state']['qdisc'].values())
          assert report['cleanup_errors'] == [], report['cleanup_errors']
          assert Path('/tmp/ntarlink-s2.pcap').stat().st_size > 24
          print('S2 real Linux acceptance:', [p['success'] for p in observations])
          print('S2 measured received bytes:', report['iperf']['received_bytes'])
          print('S2 scheduler lateness (ns):', [e['scheduler_lateness_ns'] for e in report['events']])
          PY
          ! sudo ip netns list | grep -E '^nts2n[0-9]+($| )'
      - name: Verify real IP backup-ISL path switching in Linux
        run: |
          sudo python systems/network-emulation/s2_routing.py scenarios/s2-route-failover.json --source ue-a --target internet --tag r2 --apply --time-scale 20 --iperf --pcap /tmp/ntarlink-s2-routing.pcap --output /tmp/s2-routing-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.load(open('/tmp/s2-routing-report.json'))['report']
          events = report['events']
          assert len(events) == 2, events
          assert 'isl-a-b' in report['initial_path'], report['initial_path']
          assert 'isl-a-b' not in events[0]['selected_path'], events[0]
          assert 'isl-a-c' in events[0]['selected_path'], events[0]
          assert 'isl-c-b' in events[0]['selected_path'], events[0]
          assert 'isl-a-b' in events[1]['selected_path'], events[1]
          assert all(p['success'] for p in report['probes']), report['probes']
          assert report['iperf_initial']['received_bytes'] > 0, report['iperf_initial']
          assert Path('/tmp/ntarlink-s2-routing.pcap').stat().st_size > 24
          assert report['continuous_ping']['received_reply_count'] > 0, report['continuous_ping']
          transitions = report['route_transition_observations']
          assert len(transitions) == len(events), transitions
          assert all(t['clock'] == 'S2_host_UTC_wall_clock_not_S1_virtual_time' for t in transitions)
          assert all(t['route_applied_wall_utc_ns'] >= t['fault_start_wall_utc_ns'] for t in transitions)
          assert all(t['assessment'] in (
              'sampled_unanswered_then_replied',
              'sampled_unanswered_without_recovery_in_window',
              'no_unanswered_observed_at_probe_cadence',
              'insufficient_probe_evidence',
          ) for t in transitions), transitions
          assert report['probe_clock']['origin_clock_pair_uncertainty_ns'] >= 0
          assert report['probe_window_wall_ns'] >= report['expected_probe_window_wall_ns'], report
          assert report['expected_probe_window_wall_ns'] > events[-1]['at_ns'] * 20, report
          assert not report['cleanup_errors'], report['cleanup_errors']
          print('S2 live route recovery:', [e['selected_path'] for e in events])
          print('S2 controller apply wall ns:', [e['controller_apply_elapsed_ns'] for e in events])
          PY
          ! sudo ip netns list | grep -E '^ntr2n[0-9]+($| )'
      - name: Compare measured 50 ms and 200 ms continuous-probe sampling
        run: |
          python - <<'PY'
          import json
          import resource
          import subprocess
          import time

          results = []
          for cadence in (200, 50):
              output = f"/tmp/s2-cadence-{cadence}.json"
              before = resource.getrusage(resource.RUSAGE_CHILDREN)
              started = time.monotonic_ns()
              subprocess.run([
                  "sudo", "python", "systems/network-emulation/s2_routing.py",
                  "scenarios/s2-route-failover.json", "--source", "ue-a",
                  "--target", "internet", "--tag", "r2", "--apply",
                  "--time-scale", "20", "--probe-interval-ms", str(cadence),
                  "--output", output,
              ], check=True)
              elapsed = time.monotonic_ns() - started
              after = resource.getrusage(resource.RUSAGE_CHILDREN)
              report = json.load(open(output))["report"]
              probe = report["continuous_ping"]
              assert report["probe_interval_ms"] == cadence, report
              assert probe["received_reply_count"] > 0, probe
              assert len(report["route_transition_observations"]) == 2, report
              assert not report["cleanup_errors"], report["cleanup_errors"]
              results.append({
                  "probe_interval_ms": cadence,
                  "host_elapsed_monotonic_ns": elapsed,
                  "orchestrator_child_cpu_seconds": (
                      after.ru_utime + after.ru_stime - before.ru_utime - before.ru_stime
                  ),
                  "unique_replies": probe["received_reply_count"],
                  "duplicate_replies": probe["duplicate_reply_count"],
                  "summary_transmitted": probe["ping_summary_transmitted"],
                  "summary_received": probe["ping_summary_received"],
                  "summary_lost": probe["ping_summary_lost"],
                  "route_transition_observations": report["route_transition_observations"],
              })
              assert results[-1]["summary_transmitted"] is not None, probe
          # A bounded 6-second host experiment is not a statistical performance
          # benchmark: preserve raw evidence rather than assert an ideal ratio.
          with open("/tmp/s2-cadence-comparison.json", "w") as output:
              json.dump({
                  "fidelity": "S2-measured-Linux-IP",
                  "clock": "host_monotonic_elapsed_and_UTC_ping_samples",
                  "cpu_scope": "orchestrator_child_processes_not_total_host_cpu",
                  "runs": results,
              }, output, indent=2)
          print("S2 measured probe cadence comparison:", results)
          PY
          ! sudo ip netns list | grep -E '^ntr2n[0-9]+($| )'
      - name: Save measured S2 evidence (no synthetic labels)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-linux-ip-evidence
          path: |
            /tmp/s2-plan.json
            /tmp/s2-routing-plan.json
            /tmp/s2-routing-report.json
            /tmp/s2-cadence-*.json
            /tmp/ntarlink-s2-routing.pcap
            /tmp/s2-host-deps.json
            /tmp/s2-report.json
            /tmp/ntarlink-s2.pcap
          if-no-files-found: ignore
          retention-days: 7
